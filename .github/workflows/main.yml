name: Render HyperFrames Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chrome system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libx11-xcb1 libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2

      - name: Install HyperFrames
        run: npm install hyperframes

      - name: Render Video to MP4
        run: npx hyperframes render . --output az900.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: az900-final-video
          path: az900.mp4

