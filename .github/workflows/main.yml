name: Render HyperFrames Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & HyperFrames
        run: |
          npm init -y
          npm install hyperframes

      - name: Run Render
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "false"
        run: |
          npx hyperframes render . --output az900.mp4

      - name: Upload video result
        uses: actions/upload-artifact@v4
        with:
          name: az900-final-video
          path: az900.mp4
